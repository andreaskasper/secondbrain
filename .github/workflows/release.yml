name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: "1.25"

jobs:
  # Never publish an image whose tests did not pass. The full CI suite runs
  # separately; this repeats the fast part as a gate.
  gate:
    name: Test before publishing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  publish:
    name: Build and push image
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-main.$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      # arm64 is a first-class target here: a good deal of this runs on a
      # small home server rather than a cloud VM.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # We set :latest ourselves below; without this the action adds its
          # own and the build command carries the tag twice.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=secondbrain
            org.opencontainers.image.description=An MCP server that gives an agent structured access to a knowledge base kept as plain Markdown files
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Andreas Kasper

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILT=${{ steps.version.outputs.built }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # A signed statement of where the image came from, for a container that
      # will be handed somebody's entire knowledge base.
      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo "**Version:** ${{ steps.version.outputs.version }}"
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Static binaries for people who would rather not run a container. The
  # binary is self-contained - pure-Go SQLite, no libc, no shared objects -
  # so a single file per platform is the whole distribution.
  binaries:
    name: Build release binaries
    needs: gate
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/go.sum

      - name: Build
        working-directory: src
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          name="secondbrain-${version}-${GOOS}-${GOARCH}"
          mkdir -p "$RUNNER_TEMP/dist"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA} -X main.built=${built}" \
            -o "$RUNNER_TEMP/dist/${name}" .
          cd "$RUNNER_TEMP/dist"
          sha256sum "$name" > "${name}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: GitHub release
    needs: [publish, binaries]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Container image

          \`\`\`
          docker pull ghcr.io/andreaskasper/secondbrain:${VERSION}
          \`\`\`

          linux/amd64 and linux/arm64. Digest \`${DIGEST}\`.

          ## Binaries

          Static, no dependencies. Verify with the accompanying \`.sha256\`
          file, then \`chmod +x\` and run.
          EOF

          gh release create "${GITHUB_REF_NAME}" \
            --title "secondbrain ${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --verify-tag \
            dist/* || \
          gh release create "${GITHUB_REF_NAME}" \
            --title "secondbrain ${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            dist/*
