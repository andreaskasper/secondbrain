name: Package skills

# Each directory under skills/ is an Agent Skill. This workflow zips every one
# of them into skills/<name>.skill and commits the result back, so a skill can
# be installed from a single link rather than by cloning the repository and
# copying a folder.
#
# Two things make committing a build artefact back into the tree tolerable
# here. The archives are byte-for-byte reproducible, so an unchanged skill
# produces an unchanged file and therefore no commit. And the path filter
# ignores the archives themselves, so the push this workflow makes cannot
# trigger it again.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '!skills/*.skill'
      - '.github/workflows/skills.yml'
  pull_request:
    paths:
      - 'skills/**'
      - '!skills/*.skill'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-skills-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone is enough; we only ever add a commit on top.
          fetch-depth: 1

      - name: Validate and package
        id: package
        run: python3 .github/scripts/package_skills.py

      - name: Upload archives as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skills
          path: skills/*.skill
          if-no-files-found: error
          retention-days: 30

      # A pull request only gets the validation and the artifacts. Committing
      # into somebody else's branch from CI is a surprise nobody wants.
      - name: Commit the archives
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all skills/*.skill
          if git diff --cached --quiet; then
            echo "No archive changed."
            exit 0
          fi
          git commit -m "Package skills: ${{ steps.package.outputs.summary }}"
          # Someone may have pushed while we were building.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Attach the archives to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" skills/*.skill --clobber
