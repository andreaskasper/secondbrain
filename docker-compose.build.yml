# Build from this checkout instead of pulling the published image.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# The local image is tagged secondbrain:local rather than reusing the ghcr.io
# name, so a development build can never be mistaken for a release - and
# plain "docker compose up" keeps pulling the real one.

services:
  secondbrain:
    image: secondbrain:local
    build:
      context: .
      args:
        VERSION: dev
        COMMIT: local
